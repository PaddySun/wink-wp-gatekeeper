name: test

on: [push, pull_request]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 基线说明（2026-11-11，B0；CI 实锤修订 c070d42 后）：
        # - PHPUnit 12 平台要求 PHP >= 8.3（CI 实锤：8.2 job composer 解析无可装版本，
        #   B0 报告「PHPUnit 12 要求 >=8.2」为静态推断失误已修正）——矩阵收敛 8.3，
        #   与本机开发基线一致（PHP 8.3.36 + phpunit 12 phar，782→1104 全部 8.3 产出）。
        # - tests/InterceptDigestUsageTest.php 使用 str_contains()（PHP 8.0+）——7.4/8.0 需降 PHPUnit 另配 schema，暂不承诺。
        # - Requires PHP: 7.4 的运行时兼容性未经机制验证，留档待验（见 docs/reports/IMPL-B0-2026-11-11.md）。
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # 【W1·composer.lock 入库】2026-11-18 本机 composer.phar 2.11.1 + PHP 8.3.36 生成
      # （`composer update --no-install`；phpunit/phpunit 钉 12.5.43 与批 I 约束一致，78 包，
      # validate --strict 锁定新鲜度）。本步 composer install 走 lock 确定性安装——
      # I-3 注记「lock 未入库浮动解析」前提退役；精确钉版语义不变。
      - name: Install dev dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit (pure PHP unit tests, zero WP dependency)
        run: vendor/bin/phpunit --configuration tests/phpunit.xml
