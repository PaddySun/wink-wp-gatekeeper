<svg xmlns="http://www.w3.org/2000/svg" width="32" height="36" viewBox="0 0 32 36" fill="none" role="img" aria-labelledby="lgTitle" class="lg-shield">
  <title id="lgTitle">Winking shield, blinking</title>
  <style>
    /* 颜色：默认雷池红，外部可用 style="color:xxx" 覆盖 */
    .lg-shield{color:#FF4D4F}

    /* 每 4.2s 眨一次：闭眼约 130ms，睁眼约 120ms，其余时间静止 */
    @keyframes lg-blink{
      0%, 92%, 100%{transform:scaleY(1)}
      95%, 97%   {transform:scaleY(.08)}
    }

    .lg-eye{
      transform-box:fill-box;
      transform-origin:center;
      animation:lg-blink 4.2s cubic-bezier(.4,0,.2,1) infinite;
    }

    @media (prefers-reduced-motion:reduce){
      .lg-eye{animation:none}
    }
  </style>

  <!-- 盾牌轮廓：左右以 x=16 严格对称 -->
  <path d="M16 2.3 L28.9 6.7 C30.1 7.1 30.9 8.1 30.8 9.2 C30.05 17.35 26.45 26.35 17.1 32.15 A1.1 1.1 0 0 1 14.9 32.15 C5.55 26.35 1.95 17.35 1.2 9.2 C1.1 8.1 1.9 7.1 3.1 6.7 Z"
        stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 左眼：实心圆点，眨眼时纵向压扁成一条线 -->
  <circle class="lg-eye" cx="11.6" cy="14.4" r="1.85" fill="currentColor"/>

  <!-- 右眼：上挑的眨眼弧线 -->
  <path d="M18.65 13.2c1.15.95 2.4.95 3.5 0"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 微笑 -->
  <path d="M11.4 20.2c2.85 1.95 6.35 1.95 9.2 0"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
